<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}} - {{SITE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESC}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/brand/favicon.png">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button class="menu-toggle" aria-label="Toggle navigation" onclick="document.body.classList.toggle('nav-open')">
    <span></span><span></span><span></span>
  </button>
  <a class="brand" href="index.html">
    <img class="brand-mark" src="assets/img/brand/gammaos-logo-tile.png" alt="GammaOS logo" width="28" height="28">
    <span class="brand-text">GammaOS <b>Nano</b></span>
  </a>
  <div class="search" role="search">
    <input id="search-input" type="text" placeholder="Search the wiki..." autocomplete="off" aria-label="Search">
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <div class="topbar-actions">
    <a class="ghost-btn" href="https://github.com/TheGammaSqueeze" target="_blank" rel="noopener">GitHub</a>
    <button class="theme-btn" aria-label="Toggle dark mode" onclick="toggleTheme()"><span class="theme-ico"></span></button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav class="nav">
      {{SIDEBAR}}
    </nav>
  </aside>

  <main id="main" class="{{CONTENT_CLASS}}">
    {{HERO}}
    <div class="prose {{HAS_TOC}}">
      <article class="article">
        {{BODY}}
        <footer class="page-foot">
          <p>GammaOS Nano is community software. This wiki is maintained alongside the OS.</p>
        </footer>
      </article>
      <div class="toc-col">{{TOC}}</div>
    </div>
  </main>
</div>

<div class="nav-scrim" onclick="document.body.classList.remove('nav-open')"></div>
<script src="assets/js/main.js"></script>
</body>
</html>
